name: Deploy Countdown Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate inline JavaScript and DOM references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No inline JavaScript found'
          script = '\n'.join(scripts)
          Path('/tmp/countdown-studio-check.js').write_text(script, encoding='utf-8')
          ids = set(re.findall(r'id="([^"]+)"', html))
          refs = set(re.findall(r'\$\("([^"]+)"\)', script))
          missing = sorted(refs - ids)
          assert not missing, f'Missing DOM IDs: {missing}'
          PY
          node --check /tmp/countdown-studio-check.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location "$url" -o /tmp/countdown-studio-live.html; then
              if grep -q "Countdown Studio" /tmp/countdown-studio-live.html; then
                echo "Published page responds and contains the app title."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published page could not be verified at $url" >&2
          exit 1
